<!DOCTYPE html>
<html>

<head>
    <script type="importmap">
        {
            "imports": {
                "codemirror": "https://esm.sh/*codemirror",
                "@codemirror/": "https://esm.sh/*@codemirror/",
                "crelt": "https://esm.sh/crelt",
                "@lezer/": "https://esm.sh/*@lezer/",
                "@marijn/": "https://esm.sh/@marijn/",
                "style-mod": "https://esm.sh/style-mod",
                "w3c-keyname": "https://esm.sh/w3c-keyname"
            }
        }
    </script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        .hidden {
            display: none;
        }

        html,
        body {
            margin: 0;
            height: 100vh;
            width: 100vw;
        }

        body {
            padding: 10px 20px 0 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .aspect {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-aspect-ratio: 1/1) {
            .aspect {
                flex-direction: row;
            }
        }

        .data {
            flex: 1;
            min-height: 0;
            min-width: 0;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
        }

        .err {
            font-family: monospace;
            font-size: smaller;
            padding: 5px;
        }

        .cm-editor {
            flex: 1;
            min-height: 0;
            min-width: 0;
        }

        .cm-editor.hidden {
            /* the simple .hidden isn't enough to override CodeMirror's CSS */
            display: none !important;
        }

        .cm-scroller {
            overflow: auto;
        }

        #version {
            text-align: center;
            font-size: small;
            color: #eee;
        }
    </style>
</head>

<body>
    <div class="aspect">
        <div id="ours" class="data">
            <select id="mode">
                <option value="Neutered">Tindalwic - neutered</option>
                <option value="Compact">Tindalwic - compact</option>
                <option value="Verbose">Tindalwic - verbose</option>
            </select>
            <pre id="theirErr" class="err hidden"></pre>
        </div>
        <div id="theirs" class="data">
            <select id="format">
                <option value="JSON">JSON</option>
                <option value="TOML">TOML</option>
                <option value="YAML">YAML</option>
            </select>
            <pre id="ourErr" class="err hidden"></pre>
        </div>
    </div>
    <span id="version"></span>

    <script id="example.tindalwic" type="text/plain">
#
	# Examples of Tindalwic Data
	These are all lumped together into a single file, but each example would also
	work if extracted to its own file and stripped of one level of indentation.
	The `try_from_dict_without_epilog` API does exactly that.

{comment block}
	#
		This example has only a prolog comment block.
		All comments are assumed to be Github Flavored Markdown

{comment shortcut}
	# you can skip the block if there's just one line

{comment flow}
	# if you really want to you can flow from the first line into a block...
		but that can obscure the GFM: this whole block looks like it is a code block
		    this is actually a code block because those need additional indentation
		tindalwic consumes the margin before sending the content on to GFM

{warning about shortcut comments}
	# they can't follow values, the # must always come right after the margin
		{writing something like this} # is tempting but not supported (yet?)

{curly brackets surround keys and open a nested dictionary}
	# you've seen several of these already - all the examples are dictionaries
	{dictionaries can nest}
		{as deep as you need them to go}
			{}
				# the empty string is a valid key
		{{{no quoting/escaping, only the 1st and last chars are brackets}}}

{square brackets surround keys and open a nested list}
	[lists entries in dictionaries have keys]
		# but keys aren't a thing for list items so the brackets surround nothing
		{}
			[]
			[previous entry's key was empty]
				[]
		[]

{angle brackets surround keys and open a text block}
	<key for the text>
		these are very similar to comments, but GFM is not assumed, and can't flow
		text values are, of course, leafs so nothing can nest inside it:
		{this is just text}
		the content is verbatim UTF-8, quoting/escaping isn't needed.

{the first char of a text block can be a TAB}
	<key>
			<- like this.
		indentation is always TABs, never spaces, and increases strictly monotonically.
		other syntaxes are more flexible, but they all need quoting/escaping mechanisms.

{epilog comments for text}
	<key>
		# this is text, not a comment (verbatim, no quoting/escaping).
		there's no room in the block for anything but text.
	# epilog comments can follow the block so you can describe a text values
		they dedent back to the same level as the brackets

{shortcut for single-line text dictionary entries}
	{dict}
		# two ways to write the same entry:
		key=value
		<key>
			value
		# spaces are not (yet?) stripped, so this is different:
		key = value
		# that key is 4 chars long

{shortcut for single-line text list items}
	[list]
		# two ways to write the same item:
		value
		<>
			value

{epilog comments are not just for text}
	# dedent-and-follow works for dictionaries and lists as well
	{dict}
		# prolog for dict
		key=value
		# epilog for value
	# epilog for dict
	[list]
		# prolog for list
		item
		# epilog for item
	# epilog for list

{keys aren't limited to single-line text}
	@
		use an "at" sign to contain a block of text
		the LF chars between the lines is part of the key
		but, of course, not the margin
	<>
		and the value follows the key block, looking like a list item
		it would be invalid syntax for the brackets to surround any chars

{keys can also have comments}
	# they can't use # or they would be ambiguous with prolog comments like this, so

	// key comments precede the entry and use the double-slash syntax
		they flow, and they can follow a blank line
	key1=value1

	key2=value2
	# as you may have noticed already, a blank line is allowed even without a comment

	// they work the same way for all the key flavors
	<key3>
		value3

    </script>

    <script type="module">
        import init, { from_tindalwic, into_tindalwic, version } from './tindalwic_playground.js';
        await init();
        document.getElementById("version").innerText = version();
        import { basicSetup } from "codemirror";
        import { EditorView, keymap } from "@codemirror/view";
        import { EditorState, Compartment } from "@codemirror/state";
        import { indentWithTab } from "@codemirror/commands";
        import { indentUnit, StreamLanguage, LRLanguage, LanguageSupport } from "@codemirror/language";
        import { StateEffect } from "@codemirror/state";
        import { json } from "@codemirror/lang-json";
        import { yaml } from "@codemirror/lang-yaml";
        import { toml } from "@codemirror/legacy-modes/mode/toml";
        import { parser } from './tindalwic_lezer.js';
        const ourDiv = document.getElementById('ours');
        const ourLanguage = LRLanguage.define({
            name: "Tindalwic",
            parser: parser
        });
        const ourView = new EditorView({
            parent: ourDiv,
            doc: document.getElementById('example.tindalwic').textContent.trim(),
            extensions: [
                basicSetup,
                indentUnit.of("\t"),
                keymap.of([indentWithTab]),
                new LanguageSupport(ourLanguage)
            ]
        });
        const theirDiv = document.getElementById('theirs');
        const languageConf = new Compartment();
        const languageExtensions = {
            JSON: json(),
            YAML: yaml(),
            TOML: StreamLanguage.define(toml)
        };
        const theirView = new EditorView({
            parent: theirDiv,
            extensions: [
                basicSetup,
                keymap.of([indentWithTab]),
                languageConf.of(languageExtensions.JSON)
            ]
        });
        let scrolling = false;
        function scroll() {
            if (scrolling) return; // avoid the rebound
            scrolling = true;
            const that = (this == ourView.scrollDOM) ? theirView.scrollDOM : ourView.scrollDOM;
            const thatVertical = (that.scrollHeight - that.clientHeight);
            const thisVertical = (this.scrollHeight - this.clientHeight) || 1;
            that.scrollTop = this.scrollTop * thatVertical / thisVertical;
            const thatHorizontal = (that.scrollWidth - that.clientWidth);
            const thisHorizontal = (this.scrollWidth - this.clientWidth) || 1;
            that.scrollLeft = this.scrollLeft * thatHorizontal / thisHorizontal;
            requestAnimationFrame(() => { scrolling = false; });
        }
        ourView.scrollDOM.addEventListener('scroll', scroll);
        theirView.scrollDOM.addEventListener('scroll', scroll);
        const ourErr = document.getElementById('ourErr');
        const theirErr = document.getElementById('theirErr');
        function reset() {
            ourView.dom.classList.remove('hidden');
            ourErr.classList.add('hidden');
            ourErr.textContent = '';
            theirView.dom.classList.remove('hidden');
            theirErr.classList.add('hidden');
            theirErr.textContent = '';
        }
        function oursToTheirs() {
            const input = ourView.state.doc.toString();
            const mode = document.getElementById('mode').value;
            const format = document.getElementById('format').value;
            let output;
            try {
                reset();
                output = from_tindalwic(input, mode, format);
            } catch (e) {
                theirView.dom.classList.add('hidden');
                ourErr.classList.remove('hidden');
                ourErr.textContent = e;
                return;
            }
            theirView.dispatch({
                changes: {
                    from: 0,
                    to: theirView.state.doc.length,
                    insert: output
                },
                effects: languageConf.reconfigure(languageExtensions[mode]),
                selection: { anchor: 0 }
            });
        }
        function theirsToOurs() {
            const input = theirView.state.doc.toString();
            const mode = document.getElementById('mode').value;
            const format = document.getElementById('format').value;
            let output;
            try {
                reset();
                output = into_tindalwic(input, mode, format);
            } catch (e) {
                ourView.dom.classList.add('hidden');
                theirErr.classList.remove('hidden');
                theirErr.textContent = e;
                return;
            }
            ourView.dispatch({
                changes: {
                    from: 0,
                    to: ourView.state.doc.length,
                    insert: output
                }
            });
        }
        ourView.dispatch({
            effects: StateEffect.appendConfig.of(EditorView.updateListener.of((update) => {
                if (update.view.hasFocus && update.docChanged) oursToTheirs();
            }))
        });
        theirView.dispatch({
            effects: StateEffect.appendConfig.of(EditorView.updateListener.of((update) => {
                if (update.view.hasFocus && update.docChanged) theirsToOurs();
            }))
        });
        document.getElementById('format').addEventListener('change', oursToTheirs);
        document.getElementById('mode').addEventListener('change', oursToTheirs);
        oursToTheirs();
    </script>

</body>

</html>
